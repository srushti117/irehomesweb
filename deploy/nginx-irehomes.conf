# Bootstrap config: HTTP only, serves the app directly on :80 while Certbot
# issues the cert. Certbot (--nginx) will rewrite this in place to add the
# HTTPS server block and redirect, same pattern as crm.irehomes.in.

server {
    listen 80;
    listen [::]:80;
    server_name irehomes.in www.irehomes.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
